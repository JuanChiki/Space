<style>
:root{
  --bg:#02030a;
  --ink:#b9f5dc;
  --dim:#3f6a5c;
  --amber:#ffb454;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Space Mono",ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;}
#stage{position:relative;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%),
    repeating-linear-gradient(to bottom,rgba(180,255,220,.022) 0 1px,transparent 1px 3px);}
#touch{display:none;position:absolute;left:0;right:0;bottom:0;padding:0 10px 10px;
  justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:2;}
.grp{display:flex;gap:8px;align-items:flex-end;pointer-events:auto;}
#touch button{font:700 13px "Space Mono",monospace;color:var(--ink);background:rgba(8,20,18,.72);
  border:1px solid var(--dim);border-radius:4px;min-width:52px;height:52px;padding:0 10px;touch-action:none;}
#touch{flex-wrap:wrap;gap:6px}#touch .grp:last-child{max-width:70%;justify-content:flex-end;flex-wrap:wrap}
#touch button.big{height:64px;min-width:92px;border-color:var(--amber);color:var(--amber);}
#touch button:active,#touch button.on{background:rgba(40,90,70,.8);}
@media (pointer:coarse){#touch{display:flex;}}
</style>
</head>

function h3(x,y,z,s){ let h = Math.imul(x,374761393) ^ Math.imul(y,668265263) ^ Math.imul(z,1442695041) ^ Math.imul(s,2246822519); h = Math.imul(h ^ (h>>>13),1274126177); h ^= h>>>16; return (h>>>0)/4294967296; }
function noise3(x,y,z,s){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  let xf=x-xi, yf=y-yi, zf=z-zi;
  xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf); zf=zf*zf*(3-2*zf);
  const a=h3(xi,yi,zi,s), b=h3(xi+1,yi,zi,s), c=h3(xi,yi+1,zi,s), d=h3(xi+1,yi+1,zi,s);

  const y1=x1+(x2-x1)*yf, y2=x3+(x4-x3)*yf;
  return y1+(y2-y1)*zf;
}

/* Generacion procedural de un planeta (nombre, tipo, atmosfera, anillos...). Determinista: no usa Math.random. */

function genName(r){ const n=2+(r()<0.4?1:0); let s=''; for(let i=0;i<n;i++) s+=SYL[Math.floor(r()*SYL.length)]; return s[0].toUpperCase()+s.slice(1)+'-'+ROM[Math.floor(r()*ROM.length)]; }
function pickType(r){ let x=r(),acc=0; for(const [t,w] of TYPE_W){ acc+=w; if(x<acc) return t; } return 'rocky'; }
function makePlanet(r,id,type,x,y,rad,forceRing){
  const [lo,hi]=RADIUS[type];
  const p={kind:'planet',id,type,x,y,r:rad||(lo+r()*(hi-lo)),
    spin:(0.04+r()*0.12)*(r()<0.2?-1:1),phase:r()*6.28,seed:Math.floor(r()*1e6)+1,
    ring:null,atmo:null,bands:4+Math.floor(r()*5),storm:[r()*6.28-3.14,(r()-0.5)*0.6],fl:Math.floor(r()*3)};
  p.name=(type==='station'?'Estación ':'')+genName(r);
  if(type==='ocean'){p.h1=205;p.h2=95;p.sat=65;p.atmo=205;p.temp=Math.round(2+r()*30);}
  else if(type==='rocky'){p.h1=12+r()*40;p.h2=p.h1+(r()-0.5)*30;p.sat=15+r()*45;p.atmo=r()<0.3?20+r()*30:null;p.temp=Math.round(-90+r()*150);}
  else if(type==='gas'){const base=[35,200,15,320,160][Math.floor(r()*5)];p.h1=base;p.h2=base+(r()-0.5)*45;p.sat=35+r()*35;p.atmo=base;p.temp=Math.round(-170+r()*70);}
  else if(type==='ice'){p.h1=190;p.h2=215;p.sat=30+r()*25;p.atmo=r()<0.25?200:null;p.temp=Math.round(-140+r()*70);}
  else if(type==='lava'){p.h1=4;p.h2=38;p.sat=85;p.temp=Math.round(380+r()*600);}
  else if(type==='desert'){p.h1=32;p.h2=18;p.sat=55+r()*20;p.atmo=r()<0.5?35:null;p.temp=Math.round(25+r()*45);}
  else if(type==='jungle'){p.h1=100;p.h2=185;p.sat=50+r()*20;p.atmo=110;p.temp=Math.round(18+r()*18);}
  else if(type==='crystal'){p.h1=275;p.h2=190;p.sat=55+r()*25;p.atmo=null;p.temp=Math.round(-60+r()*80);}
  else {p.h1=215;p.h2=48;p.sat=14;p.temp=Math.round(18+r()*6);}
  const ringP={gas:.55,ice:.12,rocky:.05,crystal:.25}[type]||0;
  if(forceRing||r()<ringP) p.ring={inner:1.4+r()*0.15,outer:1.85+r()*0.6,tilt:0.2+r()*0.16,rot:(r()-0.5)*0.5,hue:p.h1+(r()-0.5)*20};
  p.grav=type==='station'?1:(p.r/24)*(type==='gas'?1.5:1)*(0.75+r()*0.5);
  const la=-2.2+(r()-0.5)*0.5;
  let L=[Math.cos(la)*0.7,Math.sin(la)*0.6,0.55]; const m=Math.hypot(L[0],L[1],L[2]); p.L=L.map(v=>v/m);
  return p;
}

const sigCode=g=>String.fromCharCode(65+g.seed%26)+String.fromCharCode(65+((g.seed/26)|0)%26)+'-'+(100+g.seed%900);
const sigName=g=>g.st==='anomaly'?'Anomalía #'+String(g.seed%10000).padStart(4,'0'):SIG[g.st].n+' '+sigCode(g);
/* lo que ocurre al investigar una señal (determinista por semilla: siempre el mismo resultado) */
const sigFac=o=>['fed','com','pir','exp'][o.seed%4];
function sigPlan(o){
  const r=rng(o.seed^0x9e37), st=o.st, P={cr:0,xp:0,loot:[],ambush:0,txt:'',sh:''};
  if(st==='derelict'){
    if(r()<(sigFac(o)==='pir'?0.4:0.12)){ P.ambush=2; P.xp=10; P.txt='Era una trampa: piratas escondidos entre los restos.'; P.sh='¡era una trampa!'; }
    else{ const n=2+Math.floor(r()*3); for(let i=0;i<n;i++) P.loot.push([['metal','cryst','ice','bio'][Math.floor(r()*4)],1+Math.floor(r()*3)]); P.xp=25; P.txt='Recuperaste '+n+' lotes de carga.'; P.sh='carga recuperada'; }
  } else if(st==='debris'){
    const n=4+Math.floor(r()*4); for(let i=0;i<n;i++) P.loot.push([['rock','metal','ice'][Math.floor(r()*3)],1+Math.floor(r()*2)]); P.xp=12; P.txt='Chatarra aprovechable: '+n+' fragmentos.'; P.sh='chatarra aprovechable';
  } else if(st==='ruins'){
    P.cr=60+Math.floor(r()*120); P.loot.push(['cryst',2],['metal',3]); if(r()<0.4) P.loot.push(['prism',1]); P.xp=40; P.txt='Salvamento: +'+P.cr+' cr y módulos intactos.'; P.sh='+'+P.cr+' cr y módulos';
  } else if(st==='beacon'){ P.xp=15; P.txt='Pulso analizado.'; }
  else if(st==='anomaly'){ P.xp=45; P.txt='Sin explicación.'; }
  else if(st==='monolith'){ P.xp=60; P.txt='Un monolito de origen desconocido.'; P.sh='glifo registrado'; }
  else if(st==='vault'){ P.xp=120; P.txt='Camara de una civilizacion anterior.'; P.sh='camara abierta'; }
  else if(st==='rift'){ P.xp=80; P.txt='Una grieta en el espacio.'; P.sh='la grieta te traga'; }
  else if(st==='echo'){ P.xp=30; P.txt='Senal sin emisor.'; P.sh='senal descifrada'; }
  else if(st==='ghost'){ P.xp=100; P.txt='Una nave que no deberia existir.'; P.sh='nave fantasma'; }
  else P.txt='No había nada.';
  return P;
}

function regionAt(sx,sy){ if(Math.abs(sx)<2&&Math.abs(sy)<2) return null;

/* ---- js/universe/sectors.js ---- */
/* Universo en sectores: generacion determinista de planetas, asteroides y senales, y consultas sobre ellos. */

const sectors = new Map();
const sectorOf = v => Math.floor((v+SEC/2)/SEC);
function getSector(sx,sy){
  const key=sx+','+sy; let s=sectors.get(key); if(s) return s;
  const r=rng((h2(sx,sy,9001)*4294967296)>>>0);
  s={sx,sy,planets:[],rocks:[],signals:[]};
  const ox=sx*SEC, oy=sy*SEC, half=SEC/2;
  if(sx===0&&sy===0){
    s.planets.push(makePlanet(r,'p0a','ocean',62,-18,22));
    s.planets.push(makePlanet(r,'p0b','gas',-175,55,34,true));
    s.planets.push(makePlanet(r,'p0c','station',195,95,11));
    s.planets.push(makePlanet(r,'p0d','rocky',-60,-165,14));
    s.planets.push(makePlanet(rng(11),'p0e','desert',230,-120,17)); s.planets.push(makePlanet(rng(12),'p0f','jungle',-215,-150,19)); s.planets.push(makePlanet(rng(13),'p0g','crystal',40,185,15));
  } else {
    const roll=r(); const n=roll<0.38?0:roll<0.82?1:2;
    for(let i=0;i<n;i++){
      const type=r()<0.04?'station':pickType(r);
      const px=ox+(r()-0.5)*(SEC-150), py=oy+(r()-0.5)*(SEC-150);
      const pl=makePlanet(r,`p${sx},${sy},${i}`,type,px,py);
      if(s.planets.every(o=>Math.hypot(o.x-pl.x,o.y-pl.y)>(o.r*(o.ring?o.ring.outer:1.2)+pl.r*(pl.ring?pl.ring.outer:1.2)+20))) s.planets.push(pl);
    }
  }
  if(sx===4&&sy===-3){ const e=makePlanet(r,'pS','station',ox+40,oy-30,12); e.name='Estacion Ecos'; s.planets.push(e); }
  const addRock=(x,y)=>{
    const rr=2+Math.pow(r(),2)*5;
    if(sx===0&&sy===0&&Math.hypot(x,y)<75) return;
    for(const p of s.planets){ if(Math.hypot(x-p.x,y-p.y)<p.r*(p.ring?1.25:1.05)+rr+6) return; }
    const k=r(); const rk=k<0.6?'rock':k<0.82?'ice':'metal';
    s.rocks.push({kind:'rock',id:`a${sx},${sy},${s.rocks.length}`,x,y,r:rr,rk,seed:Math.floor(r()*1e6)+1,spin:(r()-0.5)*0.9,phase:r()*6.28,
      name:'Asteroide '+String.fromCharCode(65+Math.floor(r()*26))+String.fromCharCode(65+Math.floor(r()*26))+'-'+(100+Math.floor(r()*900))});
  };
  const nCl=Math.floor(r()*3)+(sx===0&&sy===0?1:0);
  for(let k=0;k<nCl;k++){
    const cx=ox+(r()-0.5)*SEC*0.8, cy=oy+(r()-0.5)*SEC*0.8, rad=50+r()*110, n=14+Math.floor(r()*26);
    for(let i=0;i<n;i++){ const ang=r()*6.283, d=Math.sqrt(r())*rad; addRock(cx+Math.cos(ang)*d,cy+Math.sin(ang)*d*0.6); }
  }
  const nS=4+Math.floor(r()*8);
  for(let i=0;i<nS;i++) addRock(ox+(r()-0.5)*SEC,oy+(r()-0.5)*SEC);
  // señales y eventos (rng propio: no cambia nada del universo ya generado)
  if(!(sx===0&&sy===0)){
    const rs=rng((h2(sx+1000003,sy-7777,31337)*4294967296)>>>0);   // desfase: h2(x,y)==h2(-x,-y) si ambos son impares; asi las senales no salen en espejo
    if(rs()<SIGNAL_RATE){
      const px=ox+(rs()-0.5)*(SEC-80), py=oy+(rs()-0.5)*(SEC-80); let roll=rs()*SIG_W, st='nothing';
      for(const k in SIG){ roll-=SIG[k].w; if(roll<0){ st=k; break; } }
      const seed=Math.floor(rs()*1e6)+1, phase=rs()*6.28;
      if(s.planets.every(p=>Math.hypot(p.x-px,p.y-py)>p.r*(p.ring?p.ring.outer:1.2)+22))
        s.signals.push({kind:'signal',id:`g${sx},${sy},${s.signals.length}`,x:px,y:py,r:7,st,seed,phase,
          get name(){ return discovered.has(this.id)?sigName(this):'Señal desconocida'; }});
    }
  }
  if(!(sx===0&&sy===0)){ const rm=rng((h2(sx+424243,sy-98765,2718)*4294967296)>>>0);
    if(rm()<MYST_RATE){ const px=ox+(rm()-0.5)*(SEC-80), py=oy+(rm()-0.5)*(SEC-80); let roll=rm()*MYST_W, st='echo';
      for(const k in MYST){ roll-=MYST[k]; if(roll<0){ st=k; break; } }
      const seed=Math.floor(rm()*1e6)+1, phase=rm()*6.28;
      if(s.planets.every(p=>Math.hypot(p.x-px,p.y-py)>p.r*(p.ring?p.ring.outer:1.2)+22))
        s.signals.push({kind:'signal',id:`g${sx},${sy},${s.signals.length}`,x:px,y:py,r:7,st,seed,phase,get name(){ return discovered.has(this.id)?sigName(this):'Señal desconocida'; }}); } }
  sectors.set(key,s); return s;
}
/* de un id ("p0c", "a3,-2,7", "g1,1,0"...) a su objeto: el universo es determinista, no hace falta guardar nada más */
function idSector(id){
  if(/^p0[a-g]$/.test(id)) return [0,0,'planets'];
  if(id==='pS') return [4,-3,'planets'];
  const m=/^([pag])(-?\d+),(-?\d+),\d+$/.exec(id); if(!m) return null;
  return [+m[2],+m[3],m[1]==='p'?'planets':m[1]==='a'?'rocks':'signals'];
}
function resolveObj(id){ const q=idSector(id); if(!q) return null; const o=getSector(q[0],q[1])[q[2]].find(z=>z.id===id); return o?{o,sx:q[0],sy:q[1],id}:null; }
function sectorStats(sx,sy){
  const s=getSector(sx,sy), pl=s.planets.filter(p=>p.type!=='station').length, st=s.planets.length-pl, ro=s.rocks.length, sg=s.signals.length, score=pl*6+st*6+ro+sg*3;
  return {s,pl,st,ro,sg,cls:score>=55?'DENSO':score>=30?'NORMAL':score>=12?'ESCASO':'VACÍO'}   // umbrales calibrados con ~1600 sectores: 13% vacío, 30% escaso, 35% normal, 22% denso;
}

function regenHull(dt){

/* ---- js/player/inventory.js ---- */
/* Bodega: carga total, capacidad y recogida de botin. */

const cap=()=>20+SH().c+15*R.u.cargo+pfx('cargo');
let loot=[], fullT=0;   // botin flotando y temporizador del aviso de bodega llena
const tot=()=>Object.values(R.cg).reduce((a,b)=>a+b,0);

function updateLoot(dt){
  for(let i=loot.length-1;i>=0;i--){
    const l=loot[i], dx=ship.x-l.x, dy=ship.y-l.y, d=Math.hypot(dx,dy)||1; l.life-=dt;
    if(d<45){ l.vx+=dx/d*160*dt; l.vy+=dy/d*160*dt; }
    const k=Math.exp(-1.5*dt); l.vx*=k; l.vy*=k; l.x+=l.vx*dt; l.y+=l.vy*dt;
    if(d<7){ if(cap()-tot()>=l.u-0.01){ R.cg[l.g]=(R.cg[l.g]||0)+l.u; loot.splice(i,1); continue; } else if(fullT<=0){ fullT=3; toast('Bodega llena: vende en una estacion',2); } }
    if(l.life<=0) loot.splice(i,1);
  }
}

let foes=[];   // enemigos activos

function updateFoes(dt){
  for(const f of foes.slice()){
    const dx=ship.x-f.x, dy=ship.y-f.y, d=Math.hypot(dx,dy)||1, da=Math.atan2(Math.sin(Math.atan2(dy,dx)-f.a),Math.cos(Math.atan2(dy,dx)-f.a));
    const F=FOE[f.k||'raider']; f.a+=clamp(da*3,-F.turn,F.turn)*dt; const th=d>F.keep[1]?F.spd:d<F.keep[0]?-F.spd*0.6:0;
    f.vx+=Math.cos(f.a)*th*dt; f.vy+=Math.sin(f.a)*th*dt; const k=Math.exp(-0.8*dt); f.vx*=k; f.vy*=k; f.x+=f.vx*dt; f.y+=f.vy*dt; f.fl-=dt;
    if((f.cd-=dt)<=0&&d<F.rng&&Math.abs(da)<0.25){ f.cd=F.cd+Math.random()*0.6; shots.push({x:f.x,y:f.y,vx:Math.cos(f.a)*F.sp,vy:Math.sin(f.a)*F.sp,life:F.rng/F.sp+0.5,e:1,dm:F.dmg,ch:F.ch,cl:F.pal[0]}); }
    if(d<8){ hurt(8); f.hp-=2; ship.vx+=dx/d*60; ship.vy+=dy/d*60; f.fl=0.15; if(f.hp<=0) killFoe(f); }

/* ---- js/systems/scanning.js ---- */
/* Escaneo: objetivo mas cercano, progreso de escaneo, catalogo de descubrimientos. */

let target=null, tdist=0, scanTarget=null, scanP=0, infoObj=null, infoT=0;
let discovered=new Set();
try{ const raw=localStorage.getItem('vacio_catalogo'); if(raw) discovered=new Set(JSON.parse(raw)); }catch(e){}
function saveDisc(){ try{ localStorage.setItem('vacio_catalogo',JSON.stringify([...discovered])); }catch(e){} }
function updateScanning(dt){
  let best=null,bd=1e9,bw=1e9;   // bw: distancia ponderada. Las senales sin escanear tienen prioridad para que los asteroides no las tapen
  const consider=(o,pri)=>{ const d=Math.hypot(o.x-ship.x,o.y-ship.y)-o.r, w=d-(pri&&d<SCAN_RANGE?90:0); if(w<bw){ bw=w; bd=d; best=o; } };
  for(const p of near.P) consider(p);
  for(const a of near.R) consider(a);
  for(const g of near.S) consider(g,!discovered.has(g.id));
  target=bd<SCAN_RANGE?best:null; tdist=bd;
  if(keys.scan&&target){
    if(scanTarget!==target){ scanTarget=target; scanP=0; }
    const dur=discovered.has(target.id)?0.35:1.3;
    scanP=Math.min(1,scanP+dt/dur);
    if(scanP>=1){
      infoObj=target; infoT=9;
      if(!discovered.has(target.id)){ discovered.add(target.id); saveDisc(); rpgScan(target); toast('Nuevo descubrimiento: '+target.name,3.5); noteDiscovery(target); }
    }
  } else { scanP=0; scanTarget=null; }
}
function rpgScan(o){ if(!(o&&o.kind==='signal')){ gain(20); R.cr+=10; addRep({exp:1}); } prog('scan'); }   // las señales dan su propia recompensa (o ninguna)

/* ---- js/systems/exploration.js ---- */
/* Exploracion: sectores cercanos, sectores visitados, bitacora, aterrizaje y recoleccion en superficie. */

function buildNear(){
  const sx=sectorOf(ship.x), sy=sectorOf(ship.y), key=sx+','+sy;
  if(key===near.key) return;
  const P=[],R=[],S=[];
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const s=getSector(sx+dx,sy+dy); P.push(...s.planets); R.push(...s.rocks); S.push(...s.signals); }
  near={P,R,S,key};
  if(!visited.has(key)){ visited.add(key); saveArch(); }
}
let surf=null, landHeld=false;   // superficie actual (null en el espacio) y tecla de aterrizar
const landable=()=>{ let pl=null; for(const p of near.P) if(p.type!=='station'&&Math.hypot(p.x-ship.x,p.y-ship.y)-p.r<26) pl=p; return pl; };
const wrapX=x=>((x%surf.W)+surf.W)%surf.W, hz=()=>Math.round(rows*0.66);
const gy=x=>{ const a=wrapX(x)/surf.W*6.2832, k=surf.W*0.011; return hz()+Math.round((fbm(Math.cos(a)*k+5,Math.sin(a)*k+5,0.5,surf.p.seed,3)-0.5)*9*Z); };
function nodeAt(x){ const p=surf.p, xm=wrapX(x); if(Math.abs(xm-30)<7||h2(xm,p.seed,3)>0.075) return null; const u=2+Math.floor(h2(xm,p.seed,5)*3), d=surf.depl[xm]||0; if(d>=u) return null; return {x:xm,u:u-d,g:PRES[p.type][Math.floor(h2(xm,p.seed,4)*4)]}; }
function tryLand(){
  if(surf){ if(Math.abs(surf.x-surf.home)<6*Z) leave(false); else toast('Vuelve a la nave para despegar',2); return; }
  const pl=landable(); if(!pl) return toast('Acercate a un planeta para aterrizar',2);
  if(Math.hypot(ship.vx,ship.vy)>60) return toast('Frena para aterrizar',2);
  surf={sx:ship.x,sy:ship.y,sa:ship.a,p:pl,W:Math.round(Math.max(180,pl.r*12)*Z),tp:0,x:30,home:30,en:100,got:{},depl:{},prog:0}; toast('Aterrizaje en '+pl.name,2.5); if(!landed.has(pl.id)){ landed.add(pl.id); logEv('Aterrizas en '+pl.name+' por primera vez.'); }
}
function leave(lost){ for(const k in surf.got) R.cg[k]=(R.cg[k]||0)+(lost?Math.floor(surf.got[k]/2):surf.got[k]); toast(lost?'Energia agotada: evacuacion, pierdes la mitad':'Despegue exitoso',3.5); surf=null; saveR(); }
function surfUpd(dt,K){
  const S=surf, p=S.p, mv=(K[1]?1:0)-(K[0]?1:0); fullT-=dt;
  const nx=S.x+mv*14*Z*dt; if(nx<0||nx>=S.W) S.tp=0.35; S.x=((nx%S.W)+S.W)%S.W; S.tp-=dt; S.mv=mv; if(mv) S.fc=mv;
  S.en-=dt*(0.9+clamp(Math.abs(p.temp-18)/55,0,4.5)); if(S.en<=0) return leave(true);
  const xi=Math.round(S.x); let n=null; for(let d=-Math.ceil(2*Z);d<=Math.ceil(2*Z)&&!n;d++) n=nodeAt(xi+d); S.nd=n;
  if(K[2]&&n&&!mv){
    if(tot()+Object.values(S.got).reduce((a,b)=>a+b,0)>=cap()){ S.prog=0; if(fullT<=0){ fullT=3; toast('Bodega llena',2); } }
    else if((S.prog+=dt/0.7)>=1){ S.prog=0; S.got[n.g]=(S.got[n.g]||0)+1; S.depl[n.x]=(S.depl[n.x]||0)+1; gain(1); }
  } else S.prog=0;
}
let visited=new Set(['0,0']), landed=new Set(), pings={}, logBook=[];
try{ const v=JSON.parse(localStorage.getItem('space_visited')||'null'); if(Array.isArray(v)) visited=new Set(v); }catch(e){}
try{ const v=JSON.parse(localStorage.getItem('space_landed')||'null'); if(Array.isArray(v)) landed=new Set(v); }catch(e){}
try{ const v=JSON.parse(localStorage.getItem('space_pings')||'null'); if(v&&typeof v==='object') pings=v; }catch(e){}
try{ const v=JSON.parse(localStorage.getItem('space_log')||'null'); if(Array.isArray(v)) logBook=v; }catch(e){}
const saveArch=()=>{ try{ localStorage.setItem('space_visited',JSON.stringify([...visited])); localStorage.setItem('space_landed',JSON.stringify([...landed])); localStorage.setItem('space_pings',JSON.stringify(pings)); localStorage.setItem('space_log',JSON.stringify(logBook)); }catch(e){} };
function logEv(x){ const c=R.clk||0; logBook.push({d:Math.floor(c/600)+1,s:Math.floor(c%600),x}); if(logBook.length>120) logBook.shift(); saveArch(); }
for(const id of discovered){ const q=idSector(id); if(q) visited.add(q[0]+','+q[1]); }   // partidas antiguas: recuerda los sectores de lo ya catalogado

/* ---- js/systems/flight.js ---- */
/* Vuelo: giro, empuje, freno, asistencia, limite de velocidad, colisiones con planetas y asteroides. */

let assist=true;   // asistencia de vuelo (tecla Z)
function collide(o,rad,rest){
  const dx=ship.x-o.x, dy=ship.y-o.y, d=Math.hypot(dx,dy)||0.001, min=rad+6;
  if(d<min){
    const nx=dx/d, ny=dy/d;
    ship.x=o.x+nx*min; ship.y=o.y+ny*min;
    const vn=ship.vx*nx+ship.vy*ny;
    if(vn<0){ ship.vx-=(1+rest)*vn*nx; ship.vy-=(1+rest)*vn*ny; impact(-vn); }
  }
}
function flightStep(dt){
  const turn=(keys.right?1:0)-(keys.left?1:0);
  ship.av+=(turn*2.7-ship.av)*Math.min(1,dt*9);
  ship.a+=ship.av*dt;
  const fx=Math.cos(ship.a), fy=Math.sin(ship.a);
  const boost=keys.shift&&keys.up&&R.fuel>0;
  if(keys.up){ const eff=R.fuel>0?1:0.25; R.fuel=Math.max(0,R.fuel-(boost?1.6:0.5)*(1-pfx('feff'))*dt); const acc=(boost?300:100)*eff*(1+0.12*R.u.engine+pfx('acc'))*SH().e; ship.vx+=fx*acc*dt; ship.vy+=fy*acc*dt; if(showHelp&&t>1.5) showHelp=false; }
  let sp=Math.hypot(ship.vx,ship.vy);
  if(keys.down&&sp>0.01){ const dec=Math.min(sp,170*dt); ship.vx-=ship.vx/sp*dec; ship.vy-=ship.vy/sp*dec; sp-=dec; }
  if(assist&&!keys.up&&!keys.down){ const k=Math.exp(-0.28*dt); ship.vx*=k; ship.vy*=k; }
  const vmax=boost?460:(assist?190:520);
  sp=Math.hypot(ship.vx,ship.vy);
  if(sp>vmax){ const k=1-Math.min(1,dt*3)*(1-vmax/sp); ship.vx*=k; ship.vy*=k; }
  ship.x+=ship.vx*dt; ship.y+=ship.vy*dt;
  return {fx,fy,boost};
}
function collideShip(){
  for(const p of near.P) collide(p,p.r*1.02,0.55);
  for(const a of near.R) collide(a,a.r,0.8);
}

/* ---- js/systems/combat.js ---- */
/* Combate: disparo del jugador, proyectiles, dano, muerte, destruccion de enemigos y asteroides, aparicion de piratas. */

let muz=0;
let shots=[], fireCd=0, spawnT=8;   // proyectiles, enfriamiento del arma y temporizador de oleadas
function hurt(d){ if(docked) return; R.hull-=d; hitT=5; shake=Math.max(shake,Math.min(1,d/25)); if(R.hull<=0) die(); }
function die(){ logEv('Tu nave fue destruida. Pierdes la carga y parte de los créditos.'); boom(ship.x,ship.y,40,'flame'); toast('Nave destruida: pierdes la carga y 25% de creditos',4.5);
  R.cr=Math.floor(R.cr*0.75); R.cg={}; R.fuel=Math.max(R.fuel,40); ship.x=165; ship.y=95; ship.vx=ship.vy=0; camx=165; camy=95; foes=[]; shots=[]; R.hull=hullMax(); saveR(); }
function killFoe(f){ foes.splice(foes.indexOf(f),1); if(f.boss){ logEv('El jefe pirata ha sido destruido.'); R.cr+=300; addRep({pir:-15,fed:8,com:5}); if(R.st===2){ R.st=3; toast('Jefe pirata destruido. Vuelve a Estacion Ecos',5); } prog('boss'); } boom(f.x,f.y,28,'flame'); const F=FOE[f.k||'raider'], c=Math.round((20+Math.floor(Math.random()*20)+R.lv*3)*F.xp/25); R.cr+=c; R.kills++; gain(F.xp); toast(F.n+' destruido +'+c+' cr  '+addRep({pir:-4,fed:1,com:1}),2.5); prog('kill'); }
function breakRock(a){ const n=Math.max(1,Math.round(a.r*0.9)); boom(a.x,a.y,12);
  for(let i=0;i<2;i++) loot.push({x:a.x,y:a.y,vx:(Math.random()-0.5)*50,vy:(Math.random()-0.5)*50,u:n/2,g:a.rk,h:GOODS[a.rk][2],life:45});
  a.x=a.y=1e9; gain(3); }
function playerFire(dt){
  fireCd-=dt;
  if(keys.fire&&fireCd<=0){ const w=WP[R.wp], fx=Math.cos(ship.a),fy=Math.sin(ship.a), rx=-fy, ry=fx, MZ=([[5.6,0],[1,2.4],[2,2]][R.wp]||[2,2]), sd=R.wp?((muz^=1)?1:-1):0; fireCd=w.cd*(1+pfx('cd')); shots.push({x:ship.x+fx*MZ[0]+rx*MZ[1]*sd,y:ship.y+fy*MZ[0]+ry*MZ[1]*sd,vx:fx*w.s+ship.vx,vy:fy*w.s+ship.vy,life:0.9,w:R.wp}); }
}
function spawnPirates(dt,danger){
  spawnT-=dt;
  if(spawnT<=0){ const pr=R.rep.pir||0; spawnT=(7+Math.random()*7)*(pr<=-30?0.6:1);
    const safe=near.P.some(p=>p.type==='station'&&Math.hypot(p.x-ship.x,p.y-ship.y)<260);
    if(foes.length<1+Math.floor(danger*3)+(pr<=-60?2:pr<=-30?1:0)&&!safe&&curRegK!=='void'&&pr<60&&(pr<30||Math.random()<0.5)&&Math.hypot(ship.x,ship.y)>300){ const a=Math.random()*6.283, pool=SPAWN.filter(([k,d,r])=>danger>d||(r!=null&&pr<=r)).map(([k])=>k).concat(REGION_SPAWN[curRegK]||[]), k=pool[Math.floor(Math.random()*pool.length)], hp=Math.max(1,Math.round((3+Math.floor(danger*5)+(R.lv>>1))*FOE[k].hp));
      foes.push({x:ship.x+Math.cos(a)*170,y:ship.y+Math.sin(a)*170,vx:0,vy:0,a:a+3.14,hp,mhp:hp,k,cd:1.5,fl:0}); toast('Alerta: '+FOE[k].n+' detectado',2.5); } }
}
function updateShots(dt,danger){
  for(let i=shots.length-1;i>=0;i--){
    const sh=shots[i]; if(!sh) continue;   // die() reasigna shots=[] a mitad del bucle: sin esta guarda el juego se congelaba al morir por un proyectil
    sh.x+=sh.vx*dt; sh.y+=sh.vy*dt; let gone=(sh.life-=dt)<=0;
    if(!gone&&sh.e){ if(Math.hypot(sh.x-ship.x,sh.y-ship.y)<6.5){ hurt((6+danger*6)*(sh.dm||1)); gone=true; } }
    else if(!gone){
      for(const f of foes) if(Math.hypot(sh.x-f.x,sh.y-f.y)<FOE[f.k||'raider'].r){ f.hp-=dmgP(); f.fl=0.12; gone=true; boom(sh.x,sh.y,3); if(f.hp<=0) killFoe(f); break; }
      if(!gone) for(const a of near.R) if(a.x<1e8&&Math.hypot(sh.x-a.x,sh.y-a.y)<a.r+3){ a.hp=(a.hp===undefined?a.r*1.3:a.hp)-dmgP(); gone=true; boom(sh.x,sh.y,3); if(a.hp<=0) breakRock(a); break; }
      if(!gone) for(const p of near.P) if(Math.hypot(sh.x-p.x,sh.y-p.y)<p.r){ gone=true; boom(sh.x,sh.y,2); break; }
    }
    if(gone) shots.splice(i,1);
  }
}

/* ---- js/systems/economy.js ---- */
/* Economia: precios dinamicos con saturacion y eventos, combustible, componentes, venta de carga. */

const cost=k=>Math.round(100*Math.pow(R.u[k]+1,1.6));
const fuelP=st=>1.5*(1-disc(st))*(profOf(st).n==='Minera'?0.8:1), compP=st=>Math.max(1,Math.round(45*(profOf(st).n==='Cientifica'?0.7:1)*(1-disc(st)))), cn=k=>Math.floor(R.u[k]/2);
function evOf(st){ const x=Math.floor(st.x), y=Math.floor(st.y), d=Math.floor((R.clk||0)/600), h=h3(x,y,d,91); if(h>0.2) return null; return {g:GK[Math.floor(h/0.2*GK.length)],m:h3(x,y,d,92)<0.5?1.6:0.6}; }
function satOf(st,g){ const e=R.mk[st.id+'|'+g]; if(!e) return 0; const d=((R.clk||0)-e.t)/15; return e.v>0?Math.max(0,e.v-d):Math.min(0,e.v+d); }
function pushMk(st,g,n){ R.mk[st.id+'|'+g]={v:satOf(st,g)+n,t:R.clk||0}; }
function mid(st,g){ const P=profOf(st), x=Math.floor(st.x), y=Math.floor(st.y), k=GK.indexOf(g),
  b=GOODS[g][1]*(0.75+0.5*h2(x,y,k+11)), pf=P.s.includes(g)?0.7:P.d.includes(g)?1.4:1, dr=1+0.12*Math.sin((R.clk||0)/240+h2(x,k,5)*6.28);
  const ev=evOf(st); return b*pf*dr*(ev&&ev.g===g?ev.m:1)*clamp(1-0.04*satOf(st,g),0.45,1.7); }
const price=(st,g)=>Math.max(1,Math.round(mid(st,g)*0.92*(1+disc(st)*0.5))), buyP=(st,g)=>Math.max(1,Math.round(mid(st,g)*1.12*(1-disc(st))));
function snap(st){ const p={}; for(const g of GK) p[g]=[price(st,g),buyP(st,g)]; R.seen[st.id]={n:st.name,t:R.clk||0,pr:profOf(st).n,p}; }
function sellAll(doit){ let v=0,n=0; for(const g of GK){ const u=R.cg[g]||0; if(u){ v+=Math.round(u*price(docked,g)); n+=u; if(doit){ R.cg[g]=0; pushMk(docked,g,u); } } } if(doit){ R.cr+=v; gain(Math.round(n)); tradeRep(docked,n); } return v; }

/* ---- js/systems/missions.js ---- */
/* Misiones: ofertas de las estaciones, progreso y descripcion. */

function prog(k){ const m=R.m; if(m&&m.t===k&&++m.have>=m.n){ R.cr+=m.rew; gain(60); toast('Mision cumplida +'+m.rew+' cr',4); logEv('Misión cumplida: +'+m.rew+' cr.'); if(m.story){ R.st=1; toast('Senal triangulada: viaja al sector 4:-3',5); } R.m=null; } saveR(); }
function mT(m){ const d=Math.round(Math.hypot((m.x||0)-ship.x,(m.y||0)-ship.y)), dg=String(Math.round(((Math.atan2(m.y-ship.y,m.x-ship.x)*180/Math.PI+90)%360+360)%360)).padStart(3,'0');
  return m.txt||(m.t==='kill'?`piratas ${m.have||0}/${m.n}`:m.t==='scan'?`escaneos ${m.have||0}/${m.n}`:m.t==='boss'?'cazar pirata jefe':m.t==='explore'?`explorar zona a ${d}u rumbo ${dg}`:`entregar ${m.n} ${GOODS[m.g][0]} al hub`); }
function mkOffer(st){
  if(st.id==='p0c'&&R.st===0) return {t:'scan',n:3,rew:150,story:1,txt:'SENAL: escanea 3 objetos'};
  const T=['kill','scan','boss','explore']; if(st.id!=='p0c') T.push('deliver','deliver');
  const t=T[Math.floor(Math.random()*T.length)], n=2+Math.floor(Math.random()*3), o={t,n,rew:60*n+10*R.lv};
  if(t==='boss'){ o.n=1; o.rew=250+20*R.lv; }
  if(t==='explore'){ const a=Math.random()*6.283,d=900+Math.random()*900; o.n=1; o.x=Math.round(st.x+Math.cos(a)*d); o.y=Math.round(st.y+Math.sin(a)*d); o.rew=120+Math.round(d/8); }
  if(t==='deliver'){ const g=GK[Math.floor(Math.random()*5)]; o.g=g; o.n=4+Math.floor(Math.random()*6); o.rew=Math.round(o.n*GOODS[g][1]*2.5)+40; }
  return o; }
function checkExploreMission(){
  if(R.m&&R.m.t==='explore'&&Math.hypot(ship.x-R.m.x,ship.y-R.m.y)<90) prog('explore');
}

/* ---- js/systems/docking.js ---- */
/* Acoplamiento a estaciones: reglas de acceso, entrega de misiones, historia. */

let docked=null, dockHeld=false, offer=null;   // estacion actual, tecla de acoplar y mision ofrecida
function tryDock(){
  if(docked){ docked=null; return; }
  if(R.base&&Math.hypot(R.base.x-ship.x,R.base.y-ship.y)<40){
    if(Math.hypot(ship.vx,ship.vy)>70) return toast('Frena para atracar',2);
    docked={id:'base',name:'Base propia',x:R.base.x,y:R.base.y,r:8,type:'station',isBase:true}; dockPage=4; bp=0; sel=0; foes=foes.filter(f=>f.boss); shots=[]; menuMsg='Base propia. '+prodSum(); return; }
  let st=null; for(const p of near.P) if(p.type==='station'&&Math.hypot(p.x-ship.x,p.y-ship.y)-p.r<36) st=p;
  if(!st) return toast('Acercate a una estacion para atracar',2);
  { const f=profOf(st).f; if((R.rep[f]||0)<=-50) return toast('Atraque denegado: '+FAC[f]+' te considera hostil',3.5); }
  if(Math.hypot(ship.vx,ship.vy)>70) return toast('Frena para atracar',2);
  if(st.id==='pS'&&R.st===1){ spawnBoss(); R.st=2; return toast('Eco: Los piratas nos tomaron... cuidado, viene su jefe',5); }
  docked=st; dockPage=0; offer=mkOffer(st); foes=foes.filter(f=>f.boss); shots=[]; menuMsg='Bienvenido a '+st.name+' ('+profOf(st).n+' - '+FS[profOf(st).f]+' '+Math.round(R.rep[profOf(st).f])+')'; snap(st);
  if(st.id==='pS'&&R.st===3){ R.st=4; R.cr+=500; R.os[2]=1; menuMsg='Gracias, piloto. Te dejamos un Caza y 500 cr'; }
  const m=R.m; if(m&&m.t==='deliver'&&st.id==='p0c'&&(R.cg[m.g]||0)>=m.n){ R.cg[m.g]-=m.n; R.cr+=m.rew; gain(60); menuMsg='Entrega completada +'+m.rew+' cr'; tradeRep(st,20); R.m=null; }
  saveR();
}
function pollDockLandKeys(){
  if(keys.dock&&!dockHeld&&!surf) tryDock(); dockHeld=keys.dock; if(keys.land&&!landHeld) tryLand(); landHeld=keys.land;
}

/* ---- js/systems/events.js ---- */
/* Eventos emergentes: que pasa al investigar una senal (botin, emboscada, triangulacion, anomalia). */

function pingKind(o,kind){ const sx=sectorOf(o.x), sy=sectorOf(o.y), known=new Set(Object.values(pings)); let best=null, bd=1e9;
  for(let dy=-6;dy<=6;dy++) for(let dx=-6;dx<=6;dx++){ if(!dx&&!dy) continue; const k=(sx+dx)+','+(sy+dy); if(known.has(k)) continue;
    if(getSector(sx+dx,sy+dy).signals.some(g=>g.st===kind&&!discovered.has(g.id))){ const d=Math.hypot(dx,dy); if(d<bd){ bd=d; best=k; } } }
  return best; }
function sigResult(o){
  if(o.st==='monolith'||o.st==='echo'){ const k=pings[o.id]; return (o.st==='monolith'?'Glifo grabado. ':'Senal descifrada. ')+(k?'Apunta al sector '+k.replace(',',':')+'.':'No apunta a ningun lugar conocido.'); }
  if(o.st==='beacon'){ const k=pings[o.id]; return k?'Fuente triangulada en el sector '+k.replace(',',':')+'.':'El pulso no apunta a ningún lugar conocido.'; }
  return sigPlan(o).txt;
}
function pingFor(o){        // busca el lugar interesante más cercano que el jugador aún no conoce
  const sx=sectorOf(o.x), sy=sectorOf(o.y), known=new Set(Object.values(pings)); let best=null, bd=1e9;
  for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
    if(!dx&&!dy) continue; const k=(sx+dx)+','+(sy+dy); if(visited.has(k)||known.has(k)) continue;
    const s=getSector(sx+dx,sy+dy), hit=s.planets.some(p=>p.type==='station')||s.signals.some(g=>g.st!=='nothing')||s.planets.length>=2;
    if(hit){ const d=Math.hypot(dx,dy)+h2(dx,dy,5)*0.5; if(d<bd){ bd=d; best=k; } }
  }
  return best;
}
function noteDiscovery(o){  // se llama al escanear algo por primera vez
  if(o.kind==='planet'){ logEv(o.type==='station'?'Estación localizada: '+o.name+'.':'Descubriste '+o.name+' ('+TYPE_ES[o.type].toLowerCase()+').'); return; }
  if(o.kind!=='signal') return;
  const P=sigPlan(o), sec=sectorOf(o.x)+':'+sectorOf(o.y); let txt=P.txt, tt=P.sh;
  { const f=sigFac(o); let fx='';
    if(o.st==='derelict'){
      if(f==='pir'&&P.ambush&&(R.rep.pir||0)>=30){ P.ambush=0; txt='Marcas piratas: reconocieron tu nave y te dejaron pasar.'; tt='los piratas te respetan'; }
      else{ txt='Restos de '+FAC[f]+'. '+txt; if(!P.ambush) fx=addRep(f==='fed'?{fed:2}:f==='com'?{com:-3}:f==='exp'?{exp:2}:{pir:-2}); }
    } else if(o.st==='ruins'){ txt='Estacion de '+FAC[f]+'. '+txt; fx=addRep(f==='pir'?{pir:-3,fed:2}:{[f]:-4}); }
    if(fx) txt+=' ['+fx+']'; }
  if(P.cr) R.cr+=P.cr; if(P.xp) gain(P.xp);
  P.loot.forEach(([g,u])=>{ const a=Math.random()*6.283, d=3+Math.random()*10; loot.push({x:o.x+Math.cos(a)*d,y:o.y+Math.sin(a)*d*0.6,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,u,g,h:GOODS[g][2],life:70}); });
  for(let i=0;i<P.ambush;i++){ const a=Math.random()*6.283; spawnFoe('raider',o.x+Math.cos(a)*55,o.y+Math.sin(a)*55); }
  if(o.st==='beacon'){ const k=pingFor(o); pings[o.id]=k||''; txt=sigResult(o); tt=k?'fuente en sector '+k.replace(',',':'):'el pulso no lleva a ninguna parte'; }
  if(o.st==='monolith'||o.st==='vault'||o.st==='rift'||o.st==='echo'||o.st==='ghost'){ const M=R.myst;
    if(o.st==='monolith'){ if(!M.ids[o.id]){ M.ids[o.id]=1; M.g++; } const k=pingKind(o,'vault'); pings[o.id]=k||''; txt='Glifo '+Math.min(M.g,5)+'/5: "'+GLY[Math.min(M.g,5)-1]+'"'+(k?' Apunta al sector '+k.replace(',',':')+'.':''); tt='glifo '+Math.min(M.g,5)+'/5'; if(R.base) R.base.rp+=10; addRep({exp:3}); }
    else if(o.st==='vault'){ const full=M.g>=3, cr=full?400+M.g*250:150; R.cr+=cr; R.comp+=full?3:1; if(full) R.cg.prism=(R.cg.prism||0)+2; if(R.base) R.base.rp+=full?25:5; addRep({exp:full?10:3}); M.v++; txt=full?'La camara se abre: +'+cr+' cr, componentes y prismas. Los glifos encajan.':'Entreabierta: +'+cr+' cr. Con 3 glifos se abriria del todo.'; tt=full?'camara abierta':'camara entreabierta'; }
    else if(o.st==='rift'){ const a=(o.seed%628)/100, d=SEC*(8+o.seed%7); ship.x=o.x+Math.cos(a)*d; ship.y=o.y+Math.sin(a)*d; ship.vx=0; ship.vy=0; foes.length=0; M.r++; shake=1; txt='La grieta te arrojo al sector '+sectorOf(ship.x)+':'+sectorOf(ship.y)+'. Nada aqui es como lo dejaste.'; tt='lugar imposible'; }
    else if(o.st==='echo'){ const k=pingKind(o,'monolith'); pings[o.id]=k||''; txt=k?'Senal descifrada: un monolito en el sector '+k.replace(',',':')+'.':'Solo ruido: no hay monolitos al alcance.'; tt=k?'coordenadas recibidas':'solo ruido'; }
    else { spawnFoe('brute',o.x-60,o.y); spawnFoe('brute',o.x+60,o.y); R.cr+=500; R.cg.prism=(R.cg.prism||0)+3; shake=1; txt='Los motores arrancaron solos: no estaba vacia. +500 cr y prismas.'; tt='no estaba vacia'; } }
  if(o.st==='anomaly'){ shake=1; tt='los instrumentos fallan'; txt='Los instrumentos fallaron. '+SIG.anomaly.d[o.seed%SIG.anomaly.d.length]; }
  if(o.st==='nothing') tt='no hay nada';
  toast(sigName(o)+': '+tt,4.5);
  logEv(sigName(o)+' (sector '+sec+'). '+txt);
  saveR(); saveArch();
}

const DIRN=['E','SE','S','SO','O','NO','N','NE'], ARR=['>','\\','v','/','<','\\','^','/'], dirIdx=(dx,dy)=>((Math.round(Math.atan2(dy,dx)/(Math.PI/4))%8)+8)%8;
const arrowCh=(dx,dy)=>ARR[dirIdx(dx,dy)], dirName=(dx,dy)=>DIRN[dirIdx(dx,dy)];
let wpCache=null;   // objeto del rumbo marcado (cache de resolveObj)
function wpObj(){ if(!R.wpt) return null; if(!wpCache||wpCache.id!==R.wpt) wpCache=resolveObj(R.wpt); return wpCache?wpCache.o:null; }
function toggleWp(e){ if(R.wpt===e.id){ R.wpt=null; wpCache=null; toast('Rumbo cancelado',2); } else { R.wpt=e.id; wpCache=null; toast('Rumbo marcado: '+(e.o.name||e.id),3); } saveR(); }

/* ---- js/systems/regions.js ---- */
/* Regiones (nebulosa, tormenta ionica, vacio): efectos sobre el vuelo y eventos del vacio. */

let curRegK=null, stormT=5, voidT=25;   // region actual y temporizadores de tormenta y de eventos del vacio
function voidEvt(dt){ voidT-=dt; if(voidT>0) return; voidT=(curRegK==='void'?14:28)+Math.random()*25;
  const st=sectorStats(sectorOf(ship.x),sectorOf(ship.y)); if(!(curRegK==='void'||st.cls==='VACÍO'||st.cls==='ESCASO')) return;
  const E=[()=>{ gain(4); return 'Una luz lejana parpadea tres veces y se apaga.'; },
   ()=>{ R.cg.cryst=(R.cg.cryst||0)+1; return 'Polvo de cristal roza el casco: +1 cristal.'; },
   ()=>'Silencio absoluto. Por un instante el casco deja de crujir.',
   ()=>{ const k=pingFor({x:ship.x,y:ship.y}); if(k&&!Object.values(pings).includes(k)){ pings['v'+k]=k; return 'Tu radio capta un eco ordenado: algo hay en el sector '+k.replace(',',':')+'.'; } return 'Tu radio capta un eco... que se pierde.'; },
   ()=>{ shake=0.6; return 'Una sombra enorme cruza frente a las estrellas. Nadie mas la ve.'; },
   ()=>{ R.fuel=Math.min(100,R.fuel+8); return 'Una corriente de gas frio recarga tu tanque: +8 combustible.'; }];
  const m=E[Math.floor(Math.random()*E.length)](); toast(m,4); if(Math.random()<0.5) logEv(m); }
function regFx(dt){ if(surf) return; const k=regionAt(sectorOf(ship.x),sectorOf(ship.y));
  if(k!==curRegK){ curRegK=k; if(k){ toast('Entras en: '+REG[k].n+' ('+REG[k].d+')',4.5); logEv('Entras en una region: '+REG[k].n+'.'); } }
  if(docked) return;
  if(k==='nebula') R.fuel=Math.min(100,R.fuel+0.5*dt);
  if(k==='storm'){ stormT-=dt; if(stormT<=0){ stormT=4+Math.random()*3; if(R.hull>12){ R.hull-=4; shake=1; toast('Descarga ionica: -4 casco',1.5); } } }
  if(pfx('regen')>0) R.hull=Math.min(hullMax(),R.hull+pfx('regen')*dt);
  voidEvt(dt); }

/* ---- js/systems/construction.js ---- */
/* Construccion: base propia, produccion por modulos, almacen e investigacion. */

const techFx=k=>R.base?Object.keys(R.base.tech).reduce((a,id)=>a+((TECH[id]&&TECH[id].fx&&TECH[id].fx[k])||0),0):0;
const baseCap=()=>Math.round((BASE_CAP+Object.keys(R.base.mods).reduce((a,id)=>a+((MODS[id]&&MODS[id].store)||0)*R.base.mods[id],0))*(1+techFx('cap')));
const baseUsed=()=>Object.values(R.base.sto).reduce((a,b)=>a+b,0);
const mcost=c=>{ const o={}; for(const k in c) o[k]=Math.ceil(c[k]*(1-Math.min(0.5,techFx('disc')))); return o; };
const cstr=c=>Object.keys(c).map(k=>k==='cr'?c[k]+'cr':c[k]+GOODS[k][0].slice(0,3)).join(' ');
const canPay=c=>Object.keys(c).every(k=>k==='cr'?R.cr>=c[k]:(R.cg[k]||0)>=c[k]);
const pay=c=>{ for(const k in c){ if(k==='cr') R.cr-=c[k]; else R.cg[k]-=c[k]; } };
function baseRates(){ const o={}, pm=1+techFx('prod'); for(const id in R.base.mods){ const M=MODS[id]; if(M&&M.prod) for(const g in M.prod) o[g]=(o[g]||0)+M.prod[g]*R.base.mods[id]*pm; } return o; }
const prodSum=()=>{ const r=baseRates(), t=Object.keys(r).map(g=>GOODS[g][0]+' '+r[g].toFixed(1)).join('  '); return t?'Prod/min: '+t:'Sin produccion: construye modulos'; };
function baseTick(dt){ const B=R.base; if(!B) return;
  if(docked&&docked.isBase) R.hull=Math.min(hullMax(),R.hull+dt*4);
  const r=baseRates(), cap=baseCap(); let used=baseUsed();
  for(const g in r){ const a=Math.min(r[g]*dt/60,cap-used); if(a<=0) break; B.sto[g]=(B.sto[g]||0)+a; used+=a; }
  for(const id in B.mods){ const M=MODS[id]; if(M&&M.rp) B.rp+=M.rp*B.mods[id]*(1+techFx('rp'))*dt/60; } }
function buildBase(){
  if(docked||surf) return;
  if(R.base){ toast('Tu base esta a '+Math.round(Math.hypot(R.base.x-ship.x,R.base.y-ship.y))+' u  (G para atracar)',3.5); return; }
  if(near.P.some(p=>p.type==='station'&&Math.hypot(p.x-ship.x,p.y-ship.y)<300)) return toast('Muy cerca de una estacion para construir',3);
  if(!canPay(BASE_COST)) return toast('Base: necesitas '+cstr(BASE_COST)+' en tu bodega',4);
  pay(BASE_COST); R.base={x:ship.x,y:ship.y,mods:{},sto:{},rp:0,tech:{}};
  toast('Base construida. Atraca con G para ampliarla',4); logEv('Construyes una base en el sector '+sectorOf(ship.x)+':'+sectorOf(ship.y)+'.'); saveR(); }

/* ---- js/rendering/ascii.js ---- */
/* Motor de dibujo ASCII: rejilla de celdas, capas (mundo/interfaz), alta resolucion, primitivas (put, text, box, wrap) y volcado al canvas. */

let fs=touchUI?11:14, cols=80, rows=30, cw=8, chh=16, RY=2, dpr=1, vw=0, vh=0, ox0=0, oy0=0, G=[], GC=[];
let userFs=BASE_FS, Z=1, layered=false, capped=false;
let cwU=8, chhU=16, RYU=2, colsU=80, rowsU=30, ox0U=0, oy0U=0, GU=[], GCU=[];
function wantFs(){
  if(!vw) return BASE_FS;                       // en la superficie de un planeta: tamaño normal
  let f=Math.min(FS_MAX,Math.max(FS_MIN,userFs));
  capped=f>userFs; return f;
}
function setup(){
  const rect=cv.getBoundingClientRect(); vw=rect.width||window.innerWidth||800; vh=rect.height||window.innerHeight||600;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.floor(vw*dpr)); cv.height=Math.max(1,Math.floor(vh*dpr));
  fs=wantFs();
  ctx.font=`400 ${fs}px ${FONT}`;
  cw=ctx.measureText('M').width||fs*0.6; chh=Math.round(fs*1.22); RY=chh/cw;
  cols=Math.max(20,Math.floor(vw/cw)); rows=Math.max(10,Math.floor(vh/chh));
  ox0=(vw-cols*cw)/2; oy0=(vh-rows*chh)/2;
  G=new Array(cols*rows).fill(' '); GC=new Array(cols*rows).fill('');
  Z=fs<BASE_FS?BASE_FS/fs:1;
  layered=fs!==BASE_FS;
  if(layered){
    ctx.font=`400 ${BASE_FS}px ${FONT}`;
    cwU=ctx.measureText('M').width||BASE_FS*0.6; chhU=Math.round(BASE_FS*1.22); RYU=chhU/cwU;
    colsU=Math.max(20,Math.floor(vw/cwU)); rowsU=Math.max(10,Math.floor(vh/chhU));
    ox0U=(vw-colsU*cwU)/2; oy0U=(vh-rowsU*chhU)/2;
    GU=new Array(colsU*rowsU).fill(' '); GCU=new Array(colsU*rowsU).fill('');
  } else { cwU=cw; chhU=chh; RYU=RY; colsU=cols; rowsU=rows; ox0U=ox0; oy0U=oy0; GU=G; GCU=GC; }
  ctx.font=`400 ${fs}px ${FONT}`; ctx.textBaseline='middle';
}
function withUI(fn){
  if(!layered){ fn(); return; }
  const sv=[cols,rows,cw,chh,RY,G,GC,ox0,oy0,Z];
  cols=colsU; rows=rowsU; cw=cwU; chh=chhU; RY=RYU; G=GU; GC=GCU; ox0=ox0U; oy0=oy0U; Z=1;
  try{ fn(); } finally{ [cols,rows,cw,chh,RY,G,GC,ox0,oy0,Z]=sv; }
}
function put(c,r,ch,col){ if(c<0||r<0||c>=cols||r>=rows) return; const i=r*cols+c; G[i]=ch; GC[i]=col; }
function text(c,r,s,col,solid){ for(let i=0;i<s.length;i++){ if(solid||s[i]!==' ') put(c+i,r,s[i],col); } }
function box(c0,r0,w,h,col,title){
  for(let r=0;r<h;r++) for(let c=0;c<w;c++){
    const top=r===0,bot=r===h-1,l=c===0,rt=c===w-1; let ch=' ';
    if((top||bot)&&(l||rt)) ch='+'; else if(top||bot) ch='-'; else if(l||rt) ch='|';
    put(c0+c,r0+r,ch,col);
  }
  if(title) text(c0+2,r0,' '+title+' ',col,true);
}

/* Camara: sigue a la nave con un poco de adelanto segun la velocidad. */

function updateCamera(dt){
  const lim=(cols*0.22)/Z, limY=(rows*RY*0.22)/Z;

const SV=[0,0,0,0]; // albedo, mezcla de tono, emisión, blancura
function surface(p,px,py,pz,t){
  const s=p.seed;
  switch(p.type){
    case 'ocean':{
      const n=fbm(px*2.1+3,py*2.1,pz*2.1,s,4);
      const cl=fbm(px*3.2+t*0.03,py*3.6,pz*3.2,s+99,3);

      if(n>0.53){ a=0.55+(n-0.53)*1.4; m=Math.min(1,0.75+(n-0.53)*1.5); } else { a=0.3+n*0.22; m=0; }
      if(Math.abs(py)>0.86-n*0.1){ a=0.95; w=0.9; m=0; }
      if(cl>0.58){ const c=Math.min(1,(cl-0.58)*4); a+=(0.98-a)*c; w=Math.max(w,c*0.95); }
      SV[0]=a;SV[1]=m;SV[2]=0;SV[3]=w; return; }
    case 'rocky':{
      const n=fbm(px*2.6,py*2.6,pz*2.6,s,5);
      const ridge=Math.abs(noise3(px*6,py*6,pz*6,s+5)-0.5)*2;
      SV[0]=0.28+n*0.7-(ridge<0.12?0.14:0); SV[1]=n; SV[2]=0; SV[3]=0; return; }
    case 'ice':{
      const n=fbm(px*3,py*3,pz*3,s,4);

      SV[0]=(0.65+n*0.35)*(crack<0.03?0.55:1); SV[1]=n; SV[2]=0; SV[3]=0.35; return; }
    case 'gas':{
      const warp=(fbm(px*2,py*3.5,pz*2,s,3)-0.5)*0.35;
      const band=0.5+0.5*Math.sin((py+warp)*p.bands*Math.PI);
      const fine=fbm(px*1.5,py*10,pz*1.5,s+3,2);
      let a=0.36+0.4*band+(fine-0.5)*0.25, m=band, w=0;
      const lon=Math.atan2(px,pz);
      const dl=Math.atan2(Math.sin(lon-p.storm[0]),Math.cos(lon-p.storm[0])), da=py-p.storm[1];
      const sd=(dl*dl)/0.09+(da*da)/0.012;
      if(sd<1){ a=0.88-0.3*sd; m=1-m; w=0.2; }
      SV[0]=a;SV[1]=clamp(m,0,1);SV[2]=0;SV[3]=w; return; }
    case 'desert':{ const n=fbm(px*2,py*2,pz*2,s,3), d=Math.sin(pz*6+px*4+n*5);
      SV[0]=0.5+0.22*d+(n-0.5)*0.3; SV[1]=(d+1)/2; SV[2]=0; SV[3]=Math.abs(py)>0.93?0.7:0; return; }
    case 'jungle':{ const n=fbm(px*2.3+3,py*2.3,pz*2.3,s,4), m=fbm(px*5,py*5,pz*5,s+3,3), cl=fbm(px*3.2+t*0.03,py*3.6,pz*3.2,s+99,3);
      let a=n>0.46?0.3+n*0.5:0.22+n*0.2, w=0; if(cl>0.6){ const c=Math.min(1,(cl-0.6)*4); a+=(0.95-a)*c; w=c*0.9; }
      SV[0]=a; SV[1]=n>0.46?0.1+m*0.3:0.95; SV[2]=0; SV[3]=w; return; }
    case 'crystal':{ const c=h3(Math.floor(px*5+8),Math.floor(py*5+8),Math.floor(pz*5+8),s);
      SV[0]=0.3+c*0.55; SV[1]=c; SV[2]=c>0.88?0.45:0; SV[3]=0.3; return; }
    case 'lava':{
      const n=fbm(px*2.4,py*2.4,pz*2.4,s,4);
      const vein=Math.abs(noise3(px*3.5+n,py*3.5,pz*3.5,s+7)-0.5);

  }

const RAMP=' .,:;-=+*#%@';
const RING_RAMP=' .:-=+#';
function drawPlanet(p0){
  if(p0.type==='station'){ drawStationArt(p0.x,p0.y,[0,1,2,3].map(i=>({h:((p0.h1|0)+i*70)%360})),p0.seed|0,false); return; }
  const p=Z===1?p0:{...p0,x:camx+(p0.x-camx)*Z,y:camy+(p0.y-camy)*Z,r:p0.r*Z};
  const cx=cols/2+(p.x-camx), cy=rows/2+(p.y-camy)/RY;
  const ext=p.ring?p.r*p.ring.outer:p.r*1.15, exr=ext/RY;
  if(cx+ext<0||cx-ext>cols||cy+exr<0||cy-exr>rows) return;
  const c0=Math.max(0,Math.floor(cx-ext)), c1=Math.min(cols-1,Math.ceil(cx+ext));
  const r0=Math.max(0,Math.floor(cy-exr)), r1=Math.min(rows-1,Math.ceil(cy+exr));
  const spin=t*p.spin+p.phase, cs=Math.cos(spin), sn=Math.sin(spin);
  const L=p.L, rc=p.r, R2=rc*rc, A2=(rc*1.12)*(rc*1.12);
  let rcR=1,rsR=0; if(p.ring){ rcR=Math.cos(p.ring.rot); rsR=Math.sin(p.ring.rot); }
  for(let r=r0;r<=r1;r++){
    const dy=(r+0.5-cy)*RY;
    for(let c=c0;c<=c1;c++){
      const dx=c+0.5-cx, d2=dx*dx+dy*dy;
      let ringCh=null,ringCol=null,front=false;
      if(p.ring){
        const qx=dx*rcR+dy*rsR, qy=-dx*rsR+dy*rcR;
        const qt=qy/p.ring.tilt;
        const ei=Math.sqrt(qx*qx+qt*qt)/rc;
        if(ei>p.ring.inner&&ei<p.ring.outer){
          const u=(ei-p.ring.inner)/(p.ring.outer-p.ring.inner);
          let dens=0.45+0.35*Math.sin(u*23+p.seed*0.01)+0.25*Math.sin(u*57+1.3);
          if(u>0.62&&u<0.7) dens-=0.7;
          if(u<0.08||u>0.92) dens*=0.6;

          const k=Math.floor(dens*5.99);

        }

      if(d2<=R2){

        const lam=nx*L[0]+ny*L[1]+nz*L[2];
        const lit=lam>0?Math.pow(lam,0.8):0;
        let s=SV[0]*(0.045+0.955*lit)+SV[2]; if(s>1) s=1;
        const k=Math.floor(s*11.99);
        let ch=RAMP[k], col;

        G[i]=ringCh; GC[i]=ringCol;
      } else if(p.atmo!==null&&d2<=A2){

        if(lit>-0.3){ G[i]=lit>0.4?':':'.'; GC[i]=`hsl(${p.atmo|0} 70% ${(20+Math.max(lit,0)*35)|0}%)`; }
      }
    }
  }
}

/* ---- js/rendering/stations.js ---- */
/* Dibujo de estaciones espaciales y de la base propia: hub central, anillo, paneles y un modulo por cada modulo construido. */

const modHue=id=>(MODS[id]&&MODS[id].hue!=null)?MODS[id].hue:(id.length*53+id.charCodeAt(0)*7)%360;
/* ---- estacion espacial: hub central, anillo giratorio con ventanas, radios, paneles solares y un modulo (pod) por cada modulo construido ---- */
function drawStationArt(wx,wy,pods,seed,isBase){
  const sx=cols/2+(wx-camx)*Z, sy=rows/2+(wy-camy)/RY*Z, ex=31*Z, ey=31*Z/RY;
  if(sx+ex<0||sx-ex>cols||sy+ey<0||sy-ey>rows) return;
  const c0=Math.max(0,Math.floor(sx-ex)), c1=Math.min(cols-1,Math.ceil(sx+ex)), r0=Math.max(0,Math.floor(sy-ey)), r1=Math.min(rows-1,Math.ceil(sy+ey));
  const np=pods.length, rot=t*0.15, PI=Math.PI, steel='hsl(210 14% 58%)', hh=isBase?150:200, blink=(t*2|0)%2;
  const pp=pods.map((q,i)=>{ const a=PI/4+i*2*PI/Math.max(4,np); return {x:14.2*Math.cos(a),y:14.2*Math.sin(a),a,h:q.h}; });
  for(let r=r0;r<=r1;r++){ const y=(r+0.5-sy)*RY/Z;
    for(let c=c0;c<=c1;c++){ const x=(c+0.5-sx)/Z, d=Math.hypot(x,y); let ch=null,col;
      if(d<4.4){ ch=d<2?'@':d<3.3?'O':'0'; col=`hsl(${hh} 30% ${(58-d*6)|0}%)`; if(d<1.1&&blink) col='hsl(48 100% 72%)'; }
      else if(d<5.2){ ch='%'; col='hsl(210 15% 30%)'; }
      else if(d>8.4&&d<10){ const a=Math.atan2(y,x)+rot; ch=(Math.floor(a*6/PI)&1)?'=':'o'; col=ch==='o'?'hsl(48 90% 66%)':steel; }
      else if(d<=8.4){ const a=Math.atan2(y,x), m=((a%(PI/2))+PI/2)%(PI/2); if(d*Math.sin(Math.min(m,PI/2-m))<0.6){ ch='+'; col=steel; } }
      if(!ch){ for(const q of pp){ const dd=Math.hypot(x-q.x,y-q.y);
          if(dd<2.6){ ch=dd<1?(blink?'*':'O'):dd<1.9?'#':'='; col=`hsl(${q.h} 55% ${(56-dd*9)|0}%)`; break; }
          const pr=(x*Math.sin(q.a)-y*Math.cos(q.a)), al=x*Math.cos(q.a)+y*Math.sin(q.a);
          if(Math.abs(pr)<0.5&&al>10&&al<11.8){ ch=Math.abs(Math.cos(q.a))>0.7?'-':'|'; col=steel; break; } } }
      if(!ch&&Math.abs(x)>10&&Math.abs(x)<=17.5&&Math.abs(y)<0.45){ ch='='; col=steel; }
      if(!ch&&Math.abs(y)<4.5&&Math.abs(x)>17.5&&Math.abs(x)<30){ ch=((Math.floor(x*0.9)+Math.floor(y*0.9))&1)?'#':':'; col=ch==='#'?'hsl(215 65% 44%)':'hsl(215 55% 32%)'; }
      if(ch){ const i=r*cols+c; G[i]=ch; GC[i]=col; } } }
  if(isBase) text(Math.round(sx)-2,Math.round(sy-19*Z/RY),'BASE',ACC);
}

/* ---- js/ui/options.js ---- */
/* Menu de opciones: tamano de simbolos. Incluye la persistencia de esa preferencia. */

let optOpen=false, optSel=0, optGeo=null;
try{ const o=JSON.parse(localStorage.getItem('vacio_opts')||'null'); if(o&&+o.fs) userFs=Math.round(Math.min(FS_MAX,Math.max(FS_MIN,+o.fs))); }catch(e){}
const saveOpts=()=>{ try{ localStorage.setItem('vacio_opts',JSON.stringify({fs:userFs})); }catch(e){} };
const FS_PRE=[()=>FS_MIN,()=>Math.max(FS_MIN,BASE_FS-3),()=>BASE_FS,()=>Math.min(FS_MAX,BASE_FS+3)];   // Mini (1/4 de celda), Peq., Normal, Grande
const PRE_NAMES=['Mini','Peq.','Normal','Grande'], PRE_OFF=[9,16,23,32];
function setFs(v){ const n=Math.round(Math.min(FS_MAX,Math.max(FS_MIN,v))); if(n===userFs) return; userFs=n; saveOpts(); setup(); }
function openOpts(){ optOpen=true; optSel=0; for(const k in keys) keys[k]=false; }
function closeOpts(){ optOpen=false; }
function presetIdx(){ let b=0,bd=1e9; FS_PRE.forEach((f,i)=>{ const d=Math.abs(f()-userFs); if(d<bd){ bd=d; b=i; } }); return bd===0?b:-1; }
function optAct(dir){          // dir: -1 / +1 (izq/der) o 0 (enter)
  if(optSel===0){ if(dir) setFs(userFs+dir); }
  else if(optSel===1){ const i=presetIdx(); const n=dir?Math.min(3,Math.max(0,(i<0?(dir>0?0:3):i)+dir)):(i+1+4)%4; setFs(FS_PRE[n]()); }
  else if(optSel===2){ if(!dir) setFs(BASE_FS); }
  else if(optSel===3){ if(!dir) closeOpts(); }
}
function optNav(e){
  const c=e.code;
  if(c==='Escape'||c==='KeyO'){ if(!e.repeat) closeOpts(); }
  else if(c==='ArrowUp'||c==='KeyW') optSel=(optSel+3)%4;
  else if(c==='ArrowDown'||c==='KeyS') optSel=(optSel+1)%4;
  else if(c==='ArrowLeft'||c==='KeyA'||c==='Minus'||c==='NumpadSubtract') { if(c==='Minus'||c==='NumpadSubtract') setFs(userFs-1); else optAct(-1); }
  else if(c==='ArrowRight'||c==='KeyD'||c==='Equal'||c==='NumpadAdd') { if(c==='Equal'||c==='NumpadAdd') setFs(userFs+1); else optAct(1); }
  else if(c==='Enter'||c==='Space'){ if(!e.repeat) optAct(0); }
  else if(c==='Digit0'||c==='Numpad0') setFs(BASE_FS);
}
function optClick(e){
  if(!optGeo) return; const b=cv.getBoundingClientRect();
  const c=Math.floor((e.clientX-b.left-ox0U)/cwU), r=Math.floor((e.clientY-b.top-oy0U)/chhU), g=optGeo;
  if(c<g.c0||c>=g.c0+g.w||r<g.r0||r>=g.r0+g.h){ closeOpts(); return; }
  const mid=g.c0+(g.w>>1);
  if(r>=g.size-1&&r<=g.size+1){ optSel=0; optAct(c<mid?-1:1); }
  else if(r===g.pre){ optSel=1; let k=0; PRE_OFF.forEach((o,i)=>{ if(c-g.c0-2>=o-1) k=i; }); setFs(FS_PRE[k]()); }
  else if(r===g.reset){ optSel=2; optAct(0); }
  else if(r===g.close){ optSel=3; optAct(0); }
}
function drawOptions(){
  const W=Math.min(cols-2,46), h=15, c0=Math.floor((cols-W)/2), r0=Math.max(1,Math.floor((rows-h)/2));
  box(c0,r0,W,h,DIMC,'OPCIONES');
  for(let r=1;r<h-1;r++) for(let c=1;c<W-1;c++) put(c0+c,r0+r,' ',DIMC);

  P.push('"'+ep+'". Al mando de un '+SH().n+' de nivel '+R.lv+', con '+R.cr+' creditos.');
  P.push('Has cruzado '+visited.size+' sectores y catalogado '+discovered.size+' hallazgos. '+R.kills+' naves han caido ante ti.');
  const al=FACK.filter(k=>rp[k]>=30).map(k=>FAC[k]), en=FACK.filter(k=>rp[k]<=-30).map(k=>FAC[k]);
  P.push(al.length||en.length?(al.length?'Te consideran aliado: '+al.join(', ')+'. ':'')+(en.length?'Te consideran enemigo: '+en.join(', ')+'.':''):'Ninguna faccion tiene aun una opinion firme de ti.');
  P.push(R.base?'Tu base ya acoge '+Object.values(R.base.mods).reduce((a,b)=>a+b,0)+' modulos y '+Object.keys(R.base.tech).length+' tecnologias.':'Aun no has fundado una base: el vacio sigue sin dueno.');
  P.push(R.myst.g||R.myst.v||R.myst.r?'Has registrado '+R.myst.g+' glifos de los Primeros, abierto '+R.myst.v+' camaras y cruzado '+R.myst.r+' grietas.':'Los Primeros aun no te han dejado su rastro.');
  const lg=logBook.slice(-4); if(lg.length) P.push('Reciente: '+lg.map(e=>'dia '+e.d+', '+e.x).join(' / '));
  return P; }
function drawChron(){ const W=Math.min(cols-2,64), c0=Math.floor((cols-W)/2), L=[]; story().forEach(q=>L.push(...wrapT(q,W-6),'')); const H=Math.min(rows-2,L.length+4), r0=Math.max(0,Math.floor((rows-H)/2));
  for(let r=0;r<H;r++) for(let c=0;c<W;c++) put(c0+c,r0+r,' ',DIMC);
  box(c0,r0,W,H,DIMC,'CRONICA'); L.slice(0,H-4).forEach((l,i)=>text(c0+3,r0+1+i,l,i===0?ACC:HUDC)); text(c0+2,r0+H-2,'[Y] cerrar',DIMC); }

/* ---- js/ui/input.js ---- */
/* Entrada: teclado, botonera tactil, raton (muelle, archivo, consola, rueda). */

const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'down',ShiftLeft:'shift',ShiftRight:'shift',KeyE:'scan',KeyF:'fire',KeyG:'dock',KeyL:'land'};
window.addEventListener('keydown',e=>{
  if(conOpen){
    if(e.code==='Escape'||e.code==='Backquote'||e.code==='F2') conOpen=false;
    else if(e.code==='Enter'){ const l=conBuf; if(l.trim()){ conHist.push(l); conHi=conHist.length; conLog.push('> '+l); conPush(conRun(l)); saveR(); } conBuf=''; }
    else if(e.code==='Backspace') conBuf=conBuf.slice(0,-1);
    else if(e.code==='ArrowUp'){ conHi=Math.max(0,conHi-1); conBuf=conHist[conHi]||''; }
    else if(e.code==='ArrowDown'){ conHi=Math.min(conHist.length,conHi+1); conBuf=conHist[conHi]||''; }
    else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey) conBuf+=e.key;
    e.preventDefault(); return; }
  if(optOpen){ optNav(e); e.preventDefault(); return; }
  if(invOpen){ if(e.code==='KeyI'||e.code==='Escape'||e.code==='Enter') invOpen=false; e.preventDefault(); return; }
  if(chrOpen){ if(e.code==='KeyY'||e.code==='Escape'||e.code==='Enter') chrOpen=false; e.preventDefault(); return; }
  if(archOpen){ if(archNav(e)) e.preventDefault(); return; }
  if(docked&&dockNav(e)){ e.preventDefault(); return; }
  const k=KEYMAP[e.code];
  if(k){ keys[k]=true; e.preventDefault(); return; }
  if(e.repeat) return;
  if(docked&&/^\d$/.test(e.key)) menuDo(+e.key);
  else if(e.code==='KeyQ') cycleW();
  else if(e.code==='KeyM') openArch(0);
  else if(e.code==='KeyC') openArch(1);
  else if(e.code==='KeyJ') openArch(2);
  else if(e.code==='Backquote'||e.code==='F2'){ conOpen=true; conBuf=''; for(const k in keys) keys[k]=false; e.preventDefault(); }
  else if(e.code==='KeyY'){ chrOpen=true; for(const k in keys) keys[k]=false; }
  else if(e.code==='KeyB') buildBase();
  else if(e.code==='KeyI'){ invOpen=true; for(const k in keys) keys[k]=false; }
  else if(e.code==='KeyZ'){ assist=!assist; toast('Asistencia de vuelo: '+(assist?'ON':'OFF'),2); }
  else if(e.code==='KeyR'){ radarIdx=(radarIdx+1)%RADAR.length; }
  else if(e.code==='KeyH'){ if(showHelp||helpT>0){ showHelp=false; helpT=0; } else helpT=12; }
  else if(e.code==='KeyO') openOpts();
  else if(e.key==='+'||e.key==='='||e.code==='NumpadAdd') setFs(userFs+1);
  else if(e.key==='-'||e.code==='NumpadSubtract') setFs(userFs-1);
});
window.addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k){ keys[k]=false; e.preventDefault(); } });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{ keys[k]=true; b.classList.add('on'); try{ b.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); };
  const off=e=>{ keys[k]=false; b.classList.remove('on'); e.preventDefault(); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
});
document.querySelector('#touch button[data-k="opts"]').addEventListener('pointerdown',()=>openOpts());
document.querySelector('#touch button[data-k="map"]').addEventListener('pointerdown',()=>openArch(0));
document.querySelector('#touch button[data-k="chr"]').addEventListener('pointerdown',()=>{ chrOpen=!chrOpen; });
document.querySelector('#touch button[data-k="con"]').addEventListener('pointerdown',()=>{ const v=prompt('Comando (escribe ayuda):'); if(v){ toast(conRun(v)||'-',5); saveR(); } });
document.querySelector('#touch button[data-k="base"]').addEventListener('pointerdown',()=>{ buildBase(); });
document.querySelector('#touch button[data-k="inv"]').addEventListener('pointerdown',()=>{ invOpen=!invOpen; });
document.querySelector('#touch button[data-k="cat"]').addEventListener('pointerdown',()=>openArch(1));
cv.addEventListener('pointermove',e=>{ const i=dockRow(e); if(i>=0) sel=i; });
cv.addEventListener('wheel',e=>{ if(!archOpen) return; e.preventDefault(); const d=Math.sign(e.deltaY); if(archTab===1) archSel=clamp(archSel+d,0,Math.max(0,archList.length-1)); else if(archTab===2) logScroll=Math.max(0,logScroll+d*3); },{passive:false});
cv.addEventListener('pointerdown',e=>{ if(invOpen){ invOpen=false; return; } if(chrOpen){ chrOpen=false; return; } if(archOpen){ archClick(e); return; } if(optOpen){ optClick(e); return; } const i=dockRow(e); if(i>=0){ sel=i; menuDo(i<dockGeo.n-1?i+1:0); } });

/* ---- js/core/update.js ---- */
/* Orquestacion de un fotograma de logica: llama a cada sistema en orden. Aqui se ve el flujo completo. */

function update(dt){
  t+=dt; if(optOpen||archOpen||invOpen||conOpen||chrOpen) return; R.clk=(R.clk||0)+dt;
  rpgUpdate(dt);              // gameplay: base, regiones, acoplar/aterrizar, regeneración, disparo, enemigos, proyectiles, botín
  const fl=flightStep(dt);    // pilotaje (devuelve fx, fy, boost para la estela)
  buildNear();                // sectores cercanos + marca de sector visitado
  collideShip();
  emitEngineTrail(dt,fl.fx,fl.fy,fl.boost);
  updateParticles(dt);
  updateCamera(dt);
  updateScanning(dt);         // objetivo y escaneo
  if(infoT>0) infoT-=dt;
  if(toastT>0) toastT-=dt;
  if(helpT>0) helpT-=dt;
}
function rpgUpdate(dt){
  baseTick(dt); regFx(dt);
  pollDockLandKeys();
  if(surf){ const K=[keys.left,keys.right,keys.fire||keys.scan]; ship.vx=ship.vy=ship.av=0; ship.x=surf.sx; ship.y=surf.sy; ship.a=surf.sa; surfUpd(dt,K); return; }
  if(docked){ ship.vx=ship.vy=0; for(const k of ['up','left','right','down','shift','fire','scan']) keys[k]=false; return; }
  const danger=clamp(Math.hypot(ship.x,ship.y)/2500,0,1);   // peligro: crece con la distancia al origen
  regenHull(dt); autosave(dt);
  tickCargoWarning(dt); checkExploreMission();
  playerFire(dt);
  spawnPirates(dt,danger);
  updateFoes(dt);
  updateShots(dt,danger);
  updateLoot(dt);
}

/* ---- js/main.js ---- */
/* Arranque: bucle principal, ajuste automatico de rendimiento y espera de la fuente. */

let last=0;
let slowAcc=0, slowN=0;
function loop(now){
  const raw=(now-last)/1000||0.016, dt=Math.min(0.05,raw); last=now;
  update(dt); render();
  requestAnimationFrame(loop);
}
function start(){
  if(!logBook.length) logEv('Despiertas en el sector 0:0. Todo el universo está por descubrir.');
  setup(); buildNear(); camx=ship.x; camy=ship.y;
  last=performance.now(); requestAnimationFrame(loop);
  if('ResizeObserver' in window) new ResizeObserver(()=>setup()).observe(cv); else window.addEventListener('resize',setup);
}
const fontReady=(document.fonts&&document.fonts.load)
  ? Promise.race([document.fonts.load('14px "Space Mono"'),new Promise(r=>setTimeout(r,1200))])
  : Promise.resolve();
fontReady.catch(()=>{}).then(start);

})();
</script>
